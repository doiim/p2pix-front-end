name: CI & Deploy

env:
  IS_PROD: ${{ github.ref_name == 'main' || github.ref_type == 'tag' }}

on:
  push:
    branches: [main, develop]
    tags: ['*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch git notes (release CIDs)
        run: git fetch origin refs/notes/*:refs/notes/*

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bunx vitest run --passWithNoTests

      - name: Install submodule deps
        run: corepack enable && yarn --cwd p2pix-smart-contracts install --immutable

      - name: Generate contract ABIs
        env:
          ALCHEMY_API_KEY: dummy
          npm_config_user_agent: npm
        run: bun run wagmi:gen

      - name: Build SPA
        env:
          VITE_APP_ENV: ${{ env.IS_PROD == 'true' && 'production' || 'development' }}
          VITE_REOWN_PROJECT_ID: ${{ secrets.VITE_REOWN_PROJECT_ID || vars.VITE_REOWN_PROJECT_ID }}
          VITE_PIMLICO_SPONSORSHIP_POLICY_ID: ${{ secrets.VITE_PIMLICO_SPONSORSHIP_POLICY_ID || vars.VITE_PIMLICO_SPONSORSHIP_POLICY_ID }}
        run: bun run build-only

      - name: Deploy via RSYNC
        uses: up9cloud/action-rsync@v1
        continue-on-error: true
        env:
          USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.SSH_HOST }}
          KEY: ${{ secrets.SSH_KEY }}
          SOURCE: dist/
          TARGET: ${{ github.ref_name }}

      - name: Deploy to IPFS
        uses: ipshipyard/ipfs-deploy-action@v2
        id: ipfs
        continue-on-error: true
        with:
          path-to-deploy: dist
          set-github-status: false
          set-pr-comment: false
          upload-car-artifact: false
          kubo-api-url: /dns/${{ secrets.KUBO_HOST }}/tcp/443/https
          kubo-api-auth: ${{ secrets.KUBO_API_AUTH }}

      - name: Pin at Pinata
        if: steps.ipfs.outcome == 'success'
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          IPFS_CID: ${{ steps.ipfs.outputs.cid }}
        run: |
          VERSION=$(jq -r .version package.json)
          curl -sS -X POST https://api.pinata.cloud/pinning/pinByHash \
            -H "Authorization: Bearer $PINATA_JWT" \
            -H "Content-Type: application/json" \
            -d "{\"hash\":\"$IPFS_CID\",\"pinataMetadata\":{\"name\":\"p2pix_${VERSION}\"}}"

      - name: Update IPNS pointer
        if: steps.ipfs.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          KUBO_HOST: ${{ secrets.KUBO_HOST }}
          KUBO_API_AUTH: ${{ secrets.KUBO_API_AUTH }}
          IPNS_KEY: ${{ secrets.IPNS_KEY }}
          IPFS_CID: ${{ steps.ipfs.outputs.cid }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${KUBO_API_AUTH#bearer:}" \
            "https://$KUBO_HOST/api/v0/name/publish?arg=$IPFS_CID${IPNS_KEY:+&key=$IPNS_KEY}"

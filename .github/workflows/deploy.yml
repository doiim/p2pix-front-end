name: Deploy to IPFS

on:
  push:
    branches: [main, develop]
    tags: ['*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:lts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install bun
        run: npm install -g bun

      - name: Install submodule deps (yarn 4 via corepack)
        run: corepack enable && yarn --cwd p2pix-smart-contracts install --immutable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate contract ABIs
        env:
          ALCHEMY_API_KEY: dummy
        run: bun run wagmi:gen

      - name: Resolve passkey rpId (WebAuthn credential scope)
        # A passkey is cryptographically bound to its rpId, and any origin whose
        # host is a registrable suffix of that rpId can assert it. So the rpId
        # decides which environments share a passkey (and therefore the same
        # counterfactual Smart Account address).
        #
        #   - Production (p2pix.co): ISOLATED. Its mainnet passkey must never be
        #     assertable from a preview/staging subdomain, so it uses its own
        #     apex rpId.
        #   - Demo / PR previews (*.demo.p2pix.co): share `demo.p2pix.co` so every
        #     branch deploy (6.demo.p2pix.co, feature-x.demo.p2pix.co, ...) reads
        #     the same TESTNET account — convenient, and blast-radius-limited to
        #     the demo scope.
        #
        # Default is the SAFE demo scope; production is opted in explicitly via a
        # release tag or the VITE_PASSKEY_RP_ID repo/environment variable.
        run: |
          if [ -n "${{ vars.VITE_PASSKEY_RP_ID }}" ]; then
            RP_ID="${{ vars.VITE_PASSKEY_RP_ID }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            RP_ID="p2pix.co"
          else
            RP_ID="demo.p2pix.co"
          fi
          echo "VITE_PASSKEY_RP_ID=$RP_ID" >> "$GITHUB_ENV"
          echo "Resolved VITE_PASSKEY_RP_ID=$RP_ID"

      - name: Build SPA
        env:
          VITE_REOWN_PROJECT_ID: ${{ secrets.VITE_REOWN_PROJECT_ID }}
          # Demo/staging uses kernel-mode passkey accounts (ZeroDev Kernel via
          # Pimlico) instead of exactly-mode, since exactly-mode requires a
          # live deployment of exactly/webauthn-owner-plugin that doesn't
          # exist for this environment. Kernel mode only needs a bundler key.
          VITE_ACCOUNT_KIND: kernel
          VITE_PIMLICO_API_KEY: ${{ secrets.VITE_PIMLICO_API_KEY }}
          # Scopes the WebAuthn passkey (see "Resolve passkey rpId" step above).
          VITE_PASSKEY_RP_ID: ${{ env.VITE_PASSKEY_RP_ID }}
        run: bun run build-only

      - name: Upload dist artifact
        # v3 pinned: Gitea Actions does not implement the v4 cache API
        # (the runner returns ECONNREFUSED on getCacheEntry).
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy-rsync:
    needs: build
    runs-on: ubuntu-latest
    container: node:lts
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist/

      - name: Deploy via RSYNC
        uses: up9cloud/action-rsync@v1
        env:
          USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.SSH_HOST }}
          KEY: ${{ secrets.SSH_KEY }}
          SOURCE: dist/
          TARGET: ${{ github.ref_name }}

  deploy-ipfs:
    needs: build
    runs-on: ubuntu-latest
    container: node:lts
    outputs:
      cid: ${{ steps.ipfs.outputs.cid }}
    steps:
      - name: Install jq
        run: apt-get update && apt-get install -y --no-install-recommends jq

      - uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist/

      - name: Deploy to IPFS
        uses: ipshipyard/ipfs-deploy-action@v1
        id: ipfs
        with:
          path-to-deploy: dist
          set-github-status: false
          set-pr-comment: false
          kubo-api-url: ${{ secrets.KUBO_API_URL }}
          kubo-api-auth: ${{ secrets.KUBO_API_AUTH }}
          upload-car-artifact: false

  deploy-pinata:
    needs: [deploy-ipfs, deploy-rsync]
    runs-on: ubuntu-latest
    container: node:lts
    steps:
      - name: Install jq
        run: apt-get update && apt-get install -y --no-install-recommends jq

      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json

      - uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist/

      - name: Install Pinata CLI
        run: curl -fsSL https://cli.pinata.cloud/install | bash

      - name: Authenticate Pinata CLI
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: echo -n "$PINATA_JWT" > ~/.pinata-files-cli

      - name: Upload to Pinata
        env:
          PINATA_GROUP: ${{ secrets.PINATA_GROUP }}
          IPFS_CID: ${{ needs.deploy-ipfs.outputs.cid }}
        run: |
          export PATH="$HOME/.local/share/pinata/:$PATH"
          VERSION=$(jq -r .version package.json)
          UPLOAD_JSON=$(pinata upload --group "$PINATA_GROUP" --name "p2pix_${VERSION}" ./dist)
          CID=$(echo "$UPLOAD_JSON" | jq -r .cid)
          if [ -z "$CID" ] || [ "$CID" = "null" ]; then
            echo "Error: Could not parse CID. Output: $UPLOAD_JSON"
            exit 1
          fi
          {
            echo "## Deploy Summary"
            echo "- IPFS CID (kubo): \`$IPFS_CID\`"
            echo "- Pinata CID: \`$CID\`"
            echo "- Version: \`$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

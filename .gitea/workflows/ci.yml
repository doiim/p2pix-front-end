name: CI & Deploy

env:
  BUILD_MODE: ${{ gitea.event_name != 'pull_request' && gitea.ref_type == 'branch' && gitea.ref_name != 'main' && 'development' || 'production' }}
  TARGET_PREFIX: ${{ gitea.event.number && 'pr/' || gitea.ref_type == 'tag' && 'tag/' || 'branch/' }}
  TARGET_NAME: ${{ gitea.event.number || gitea.ref_name }}

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch git notes (release CIDs)
        run: git fetch origin refs/notes/*:refs/notes/*

      - name: Deploy target slug
        run: echo "DEPLOY_TARGET=$TARGET_PREFIX$(printf '%s' "$TARGET_NAME" | tr -C '[:alnum:]-' '-')" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Install submodule deps
        run: node p2pix-smart-contracts/.yarn/releases/yarn-4.9.2.cjs --cwd p2pix-smart-contracts install --immutable

      - name: Generate contract ABIs
        env:
          ALCHEMY_API_KEY: dummy
          npm_config_user_agent: npm
        run: bun run wagmi:gen

      - name: Unit tests
        run: bunx vitest run --passWithNoTests

      - name: Build SPA
        env:
          VITE_APP_ENV: ${{ env.BUILD_MODE }}
          VITE_REOWN_PROJECT_ID: ${{ secrets.VITE_REOWN_PROJECT_ID || vars.VITE_REOWN_PROJECT_ID }}
          VITE_PIMLICO_SPONSORSHIP_POLICY_ID: ${{ secrets.VITE_PIMLICO_SPONSORSHIP_POLICY_ID || vars.VITE_PIMLICO_SPONSORSHIP_POLICY_ID }}
        run: bun run build-only --mode "$VITE_APP_ENV"

      - name: Deploy via RSYNC
        uses: up9cloud/action-rsync@v1
        continue-on-error: true
        env:
          USER: ${{ secrets.SSH_USER }}
          HOST: ${{ secrets.SSH_HOST }}
          KEY: ${{ secrets.SSH_KEY }}
          SOURCE: dist/
          TARGET: ${{ env.DEPLOY_TARGET }}

      - name: Setup Kubo
        continue-on-error: true
        env:
          KUBO_VERSION: v0.43.1
          # SHA-256 of the kubo_v0.43.1_linux-amd64.tar.gz release asset. A
          # version bump updates both values together; the hash is the trust
          # root, so it lives in this diff and not in an API answer.
          KUBO_SHA256: 3f2bf974ab2a3ec6d997fac7d8cb46f59983a7cddd0b55ef998e6ce379155fb2
        run: |
          curl -fsSL -o kubo.tar.gz "https://github.com/ipfs/kubo/releases/download/${KUBO_VERSION}/kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
          echo "$KUBO_SHA256  kubo.tar.gz" | sha256sum --check
          tar -xzf kubo.tar.gz
          echo "$PWD/kubo" >> "$GITHUB_PATH"
          rm kubo.tar.gz

      - name: Deploy to IPFS
        id: ipfs
        continue-on-error: true
        env:
          KUBO_API_URL: /dns/${{ secrets.KUBO_HOST }}/tcp/443/https
          KUBO_API_AUTH: ${{ secrets.KUBO_API_AUTH }}
        run: |
          # Guarded: a second init against an existing repo exits 1.
          [ -e "${IPFS_PATH:-$HOME/.ipfs}/config" ] || ipfs init
          # IPIP-0499: same CIDs as the kubo v0.42.0 pipeline produced.
          ipfs config profile apply unixfs-v1-2025
          CID=$(ipfs add -Q -r dist)
          ipfs dag export "$CID" > build.car
          ipfs dag import build.car --api "$KUBO_API_URL" --api-auth "$KUBO_API_AUTH"
          echo "cid=$CID" >> "$GITHUB_OUTPUT"

      - name: Pin at Pinata
        if: steps.ipfs.outcome == 'success'
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          IPFS_CID: ${{ steps.ipfs.outputs.cid }}
        run: |
          VERSION=$(jq -r .version package.json)
          response=$(curl -sS -w "\n%{http_code}" -X POST https://uploads.pinata.cloud/v3/files \
            -H "Authorization: Bearer $PINATA_JWT" \
            -F "network=public" \
            -F "file=@build.car" \
            -F "name=p2pix_${VERSION}" \
            -F "car=true")
          status=${response##*$'\n'}
          body=${response%$'\n'*}
          if [ "$status" != 200 ]; then
            echo "Pinata upload failed (HTTP $status): $body"
            exit 1
          fi
          # The pin is only real if Pinata reports the root CID we computed.
          pinned=$(jq -r .data.cid <<<"$body")
          if [ "$pinned" != "$IPFS_CID" ]; then
            echo "Pinata pinned $pinned, expected $IPFS_CID"
            exit 1
          fi
          echo "Pinned $pinned at Pinata as p2pix_${VERSION}"

      - name: Update IPNS pointer
        if: steps.ipfs.outcome == 'success' && gitea.ref == 'refs/heads/main'
        env:
          KUBO_HOST: ${{ secrets.KUBO_HOST }}
          KUBO_API_AUTH: ${{ secrets.KUBO_API_AUTH }}
          IPNS_KEY: ${{ secrets.IPNS_KEY }}
          IPFS_CID: ${{ steps.ipfs.outputs.cid }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${KUBO_API_AUTH#bearer:}" \
            "https://$KUBO_HOST/api/v0/name/publish?arg=$IPFS_CID${IPNS_KEY:+&key=$IPNS_KEY}"
